[package]
name = "computer-use-native"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.149"
base64 = "=0.22.1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = {version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"]}
windows-sys = {version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_RemoteDesktop"]}

[[bin]]
name = "computer-use-native"
path = "src/main.rs"

[[bin]]
name = "disposable-editor"
path = "src/fixture.rs"

