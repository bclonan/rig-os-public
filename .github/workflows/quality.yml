name: Source quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: computer-use-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: computer-use-runtime/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install Python worker test dependency
        run: python -m pip install Pillow==12.3.0
      - name: Install verified Rust toolchain and checks
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run check
      - run: npm run verify:audit
      - run: npm audit --audit-level=high
      - run: python -m unittest discover -s tests -p "*_test.py"
      - run: cargo +1.96.0 fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo +1.96.0 clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: python -m unittest discover -s docs/open-source -p "test_*.py"
        working-directory: .
      - run: python docs/system-map/verify_publication.py
        working-directory: .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan Git history and published files
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --config=/repo/.gitleaks.toml --redact=100 --max-target-megabytes=100 /repo
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir --config=/repo/.gitleaks.toml --redact=100 --max-target-megabytes=100 /repo
